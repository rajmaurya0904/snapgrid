[project]
name = "snapgrid"
version = "0.1.0"
description = "An interactive visual grid overlay for web pages that lets designers snap elements to a configurable baseline, filling the gap where no easy-to-use browser extension exists."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
snapgrid = "snapgrid.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snapgrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
